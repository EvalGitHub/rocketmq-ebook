<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RocketMQ 分布式消息队列教程</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.header {
  background: #16213e;
  border-bottom: 1px solid #0f3460;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 10;
}
.header h1 {
  font-size: 16px;
  font-weight: 600;
  color: #e94560;
}
.header-controls {
  display: flex;
  align-items: center;
  gap: 12px;
}
.header-controls button {
  background: #0f3460;
  color: #e0e0e0;
  border: 1px solid #1a4a8a;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
}
.header-controls button:hover {
  background: #1a4a8a;
}
.header-controls button:disabled {
  opacity: 0.4;
  cursor: default;
}
.page-info {
  font-size: 13px;
  color: #8899aa;
  min-width: 80px;
  text-align: center;
}
.viewer {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  overflow: auto;
  padding: 20px;
  background: #1a1a2e;
}
.viewer canvas {
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  border-radius: 4px;
  max-width: 100%;
}
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #8899aa;
  font-size: 16px;
}
.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid #0f3460;
  border-top-color: #e94560;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="header">
  <h1>RocketMQ 分布式消息队列教程</h1>
  <div class="header-controls">
    <button id="prevBtn" onclick="changePage(-1)">&#8592; 上一页</button>
    <span class="page-info" id="pageInfo">加载中...</span>
    <button id="nextBtn" onclick="changePage(1)">下一页 &#8594;</button>
    <button onclick="zoomIn()">放大 +</button>
    <button onclick="zoomOut()">缩小 -</button>
    <button onclick="toggleFit()">适应宽度</button>
  </div>
</div>
<div class="viewer" id="viewer">
  <div class="loading"><div class="spinner"></div>正在加载 PDF...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null;
let currentPage = 1;
let scale = 1.5;
let fitWidth = false;
let rendering = false;

async function loadPDF() {
  try {
    const resp = await fetch('RocketMQ.pdf');
    const buf = await resp.arrayBuffer();
    pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
    document.getElementById('pageInfo').textContent = '1 / ' + pdfDoc.numPages;
    renderPage(1);
  } catch(e) {
    document.getElementById('viewer').innerHTML = '<div class="loading">PDF 加载失败: ' + e.message + '</div>';
  }
}

async function renderPage(num) {
  if (rendering || !pdfDoc) return;
  rendering = true;
  currentPage = num;

  const page = await pdfDoc.getPage(num);
  const viewer = document.getElementById('viewer');
  const containerWidth = viewer.clientWidth - 40;

  let viewport = page.getViewport({ scale: scale });

  if (fitWidth) {
    const fitScale = containerWidth / page.getViewport({ scale: 1 }).width;
    viewport = page.getViewport({ scale: fitScale });
  }

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = viewport.width;
  canvas.height = viewport.height;

  viewer.innerHTML = '';
  viewer.appendChild(canvas);

  await page.render({ canvasContext: ctx, viewport: viewport }).promise;

  document.getElementById('pageInfo').textContent = num + ' / ' + pdfDoc.numPages;
  document.getElementById('prevBtn').disabled = num <= 1;
  document.getElementById('nextBtn').disabled = num >= pdfDoc.numPages;

  rendering = false;
}

function changePage(delta) {
  const next = currentPage + delta;
  if (next >= 1 && next <= pdfDoc.numPages) {
    renderPage(next);
  }
}

function zoomIn() {
  fitWidth = false;
  scale = Math.min(scale + 0.25, 4);
  renderPage(currentPage);
}

function zoomOut() {
  fitWidth = false;
  scale = Math.max(scale - 0.25, 0.5);
  renderPage(currentPage);
}

function toggleFit() {
  fitWidth = !fitWidth;
  renderPage(currentPage);
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); changePage(-1); }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); changePage(1); }
  if (e.key === 'Home') { e.preventDefault(); renderPage(1); }
  if (e.key === 'End') { e.preventDefault(); renderPage(pdfDoc.numPages); }
});

loadPDF();
</script>
</body>
</html>
